# Local end-to-end environment: Cove (all-in-one image) + one or two generation workers.
#
# Don't start this by hand the first time — run ./setup.ps1 (or ./setup.sh). It builds the extension,
# installs it into Cove's config, creates sample videos, starts everything and registers the workers.
#
# Workers need no media mounts: they read videos from Cove and upload the results over HTTP.
#   worker-1: dials Cove (HL_COVE_URL)       -> registered in Cove without a URL
#   worker-2: listens, Cove dials it (HL_LISTEN_URL) -> registered with ws://worker-2:8750/rpc (only with --profile multi)
name: heavylifter-local

services:
  cove:
    image: ${COVE_IMAGE:-ghcr.io/yourcove/cove:latest}
    restart: unless-stopped
    ports:
      - "${COVE_PORT:-5073}:5073"
    environment:
      # Seeds the library path on first start (a saved cove-config.json wins afterwards).
      COVE__CovePaths__0__Path: /media
      COVE__Auth__Enabled: "false"
      # Requests to http://localhost from the host are trusted even through Docker's port forwarding.
      COVE__Auth__TrustedHosts__0: localhost
      COVE__Auth__TrustedHosts__1: 127.0.0.1
    volumes:
      - cove-pgdata:/var/lib/postgresql/cove-data
      - ./.data/cove/config:/config          # extensions are pre-installed into config/extensions/
      - ./.data/cove/generated:/generated    # inspect generated covers/previews/sprites here
      - ./.data/cove/backups:/backups
      - cove-cache:/cache
      - ./.data/media:/media

  worker-1:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: remote-heavylifter-worker:local
    restart: unless-stopped
    environment:
      # "cove" is a dotless name on Docker's private network, so Cove treats these requests as local.
      HL_COVE_URL: http://cove:5073
      HL_WORKER_NAME: worker-1
      HL_WORKER_TOKEN: ${WORKER1_TOKEN:?run setup.ps1 / setup.sh first (it writes .env)}
      HL_MAX_CONCURRENCY: ${HL_MAX_CONCURRENCY:-2}
    volumes:
      - worker-1-data:/var/lib/heavylifter

  # A second worker for distribution / failover testing: `setup -TwoServers` (or --two-servers).
  worker-2:
    profiles: [multi]
    image: remote-heavylifter-worker:local
    restart: unless-stopped
    ports:
      - "${HL2_PORT:-8751}:8750"
    environment:
      HL_LISTEN_URL: http://0.0.0.0:8750
      HL_WORKER_NAME: worker-2
      HL_WORKER_TOKEN: ${WORKER2_TOKEN:?run setup.ps1 / setup.sh first (it writes .env)}
      HL_MAX_CONCURRENCY: ${HL_MAX_CONCURRENCY:-2}
    volumes:
      - worker-2-data:/var/lib/heavylifter
    depends_on:
      worker-1:
        condition: service_started

volumes:
  cove-pgdata:
  cove-cache:
  worker-1-data:
  worker-2-data:
