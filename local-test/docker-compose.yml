# Local end-to-end environment: Cove (all-in-one image) + the generation server, sharing one media folder.
#
# Don't start this by hand the first time — run ./setup.ps1 (or ./setup.sh). It builds the extension,
# installs it into Cove's config, creates sample videos, starts everything and registers the server.
#
# The same folder is mounted at DIFFERENT paths on purpose, so the extension's path mapping is exercised:
#   Cove:          ./.data/media  ->  /media
#   heavylifter:   ./.data/media  ->  /mnt/media   (read-only)
#   heavylifter-2: ./.data/media  ->  /data/library (read-only, only with --profile multi)
name: heavylifter-local

services:
  cove:
    image: ${COVE_IMAGE:-ghcr.io/yourcove/cove:latest}
    restart: unless-stopped
    ports:
      - "${COVE_PORT:-5073}:5073"
    environment:
      # Seeds the library path on first start (a saved cove-config.json wins afterwards).
      COVE__CovePaths__0__Path: /media
      COVE__Auth__Enabled: "false"
      # Requests to http://localhost from the host are trusted even through Docker's port forwarding.
      COVE__Auth__TrustedHosts__0: localhost
      COVE__Auth__TrustedHosts__1: 127.0.0.1
    volumes:
      - cove-pgdata:/var/lib/postgresql/cove-data
      - ./.data/cove/config:/config          # extensions are pre-installed into config/extensions/
      - ./.data/cove/generated:/generated    # inspect generated covers/previews/sprites here
      - ./.data/cove/backups:/backups
      - cove-cache:/cache
      - ./.data/media:/media
    depends_on:
      heavylifter:
        condition: service_healthy

  heavylifter:
    build: ../server
    image: remote-heavylifter:local
    restart: unless-stopped
    ports:
      - "${HL_PORT:-8750}:8750"
    environment:
      HL_API_KEYS: ${HL_API_KEY:?run setup.ps1 / setup.sh first (it writes .env)}
      HL_MEDIA_ROOTS: /mnt/media
      HL_MAX_CONCURRENCY: ${HL_MAX_CONCURRENCY:-2}
      HL_ARTIFACT_TTL_HOURS: "2"
    volumes:
      - ./.data/media:/mnt/media:ro
      - heavylifter-work:/var/lib/heavylifter

  # A second generation server for distribution / failover testing: `setup -TwoServers` (or --two-servers).
  heavylifter-2:
    profiles: [multi]
    image: remote-heavylifter:local
    restart: unless-stopped
    ports:
      - "${HL2_PORT:-8751}:8750"
    environment:
      HL_API_KEYS: ${HL_API_KEY:?run setup.ps1 / setup.sh first (it writes .env)}
      HL_MEDIA_ROOTS: /data/library
      HL_MAX_CONCURRENCY: ${HL_MAX_CONCURRENCY:-2}
      HL_ARTIFACT_TTL_HOURS: "2"
    volumes:
      - ./.data/media:/data/library:ro
      - heavylifter-2-work:/var/lib/heavylifter
    depends_on:
      heavylifter:
        condition: service_started

volumes:
  cove-pgdata:
  cove-cache:
  heavylifter-work:
  heavylifter-2-work:
