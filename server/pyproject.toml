[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "heavylifter"
version = "0.1.0"
description = "Remote video artifact generation server for the Cove remote-heavylifter extension"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
heavylifter = "heavylifter.main:run"

[tool.setuptools.packages.find]
include = ["heavylifter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs a real ffmpeg/ffprobe on PATH"]
